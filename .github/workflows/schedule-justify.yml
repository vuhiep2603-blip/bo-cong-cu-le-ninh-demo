name: Verify weekly schedule alignment
on:
  push:
    branches: [fix/schedule-justify]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from 'playwright'; console.log(chromium.executablePath())")"
          npm test
      - name: Verify exported documents
        run: |
          python -m pip install pymupdf python-docx
          sudo apt-get install -y poppler-utils
          python tests/verify_exports.py
      - uses: actions/upload-artifact@v4
        with:
          name: schedule-verified-bundle
          path: assets/app.js
  publish-bundle:
    needs: test
    if: github.ref == 'refs/heads/fix/schedule-justify'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schedule-justify
      - uses: actions/download-artifact@v4
        with:
          name: schedule-verified-bundle
          path: assets
      - name: Commit verified JavaScript bundle to fix branch only
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild verified schedule browser bundle"
            git push origin HEAD:refs/heads/fix/schedule-justify
          fi
